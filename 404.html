<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Artisan Restore</title>
<link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--walnut);text-align:center;padding:2rem;position:relative;overflow:hidden;}
.bg-img{position:absolute;inset:0;background:url('https://loremflickr.com/1600/900/furniture,antique?lock=5001') center/cover no-repeat;opacity:0.5;}
.content{position:relative;z-index:1;max-width:560px;}
.err-num{font-family:'Playfair Display',serif;font-size:clamp(8rem,20vw,14rem);font-weight:700;color:var(--primary);line-height:1;opacity:.35;user-select:none;}
.err-icon{width:80px;height:80px;border-radius:50%;background:rgba(200,134,10,.15);border:2px solid rgba(200,134,10,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;color:var(--primary-lt);}
h1{color:rgba(240,233,216,.95);font-size:2rem;margin-bottom:.75rem;}
p{color:rgba(240,233,216,.6);font-size:1rem;margin-bottom:2.5rem;line-height:1.7;}
.err-links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="bg-img"></div>
<div class="content">
  <div class="err-num">404</div>
  <div class="err-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
  <h1>This Page Has Wandered Off</h1>
  <p>Like a piece of furniture in need of restoration, this page seems to have gone missing. Let us help you find your way back.</p>
  <div class="err-links">
    <a href="index.html" class="btn btn-primary btn-lg">Return Home</a>
    <a href="contact.html" class="btn btn-ghost btn-lg">Contact Us</a>
  </div>
  <div style="margin-top:3rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;">
    <a href="services.html" style="color:rgba(240,233,216,.5);font-size:.85rem;transition:color .25s;" onmouseover="this.style.color='var(--primary-lt)'" onmouseout="this.style.color='rgba(240,233,216,.5)'">Services</a>
    <a href="about.html" style="color:rgba(240,233,216,.5);font-size:.85rem;transition:color .25s;" onmouseover="this.style.color='var(--primary-lt)'" onmouseout="this.style.color='rgba(240,233,216,.5)'">About</a>
    <a href="blog.html" style="color:rgba(240,233,216,.5);font-size:.85rem;transition:color .25s;" onmouseover="this.style.color='var(--primary-lt)'" onmouseout="this.style.color='rgba(240,233,216,.5)'">Blog</a>
    <a href="pricing.html" style="color:rgba(240,233,216,.5);font-size:.85rem;transition:color .25s;" onmouseover="this.style.color='var(--primary-lt)'" onmouseout="this.style.color='rgba(240,233,216,.5)'">Pricing</a>
  </div>
</div>
<script>
const t=localStorage.getItem('ar-theme')||'light';
document.documentElement.setAttribute('data-theme',t);
</script>
</body>
</html>
